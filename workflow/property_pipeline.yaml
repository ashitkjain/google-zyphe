main:
  params: [args]
  steps:
    - init:
        assign:
          - runId: ${args.runId}
          - city: ${args.city}
          - state: ${args.state}
          - baseUrl: ${args.baseUrl}
          - zpids: ${args.zpids}
          - projectId: ${args.projectId}

    - markRunning:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineUpdateRun"}
          auth:
            type: OIDC
          body:
            runId: ${runId}
            step: "_top"
            data:
              status: "running"
              startedAt: ${sys.now()}
        result: _ignored1

    # --- STEP 1: Property Data ---
    - kickPropertyData:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineCreateBatchJob"}
          auth:
            type: OIDC
          body:
            collection: "property_data_batch_jobs"
            zpids: ${zpids}
            runId: ${runId}
            stepName: "property_data"
        result: propDataKick

    - waitPropertyData:
        call: waitForBatch
        args:
          baseUrl: ${baseUrl}
          collection: "property_data_batch_jobs"
          jobId: ${propDataKick.body.jobId}
        result: propDataResult

    - retryPropertyData:
        switch:
          - condition: ${propDataResult.failed > 0}
            steps:
              - createRetryPropData:
                  call: http.post
                  args:
                    url: ${baseUrl + "/pipelineCreateBatchJob"}
                    auth:
                      type: OIDC
                    body:
                      collection: "property_data_batch_jobs"
                      zpids: ${propDataResult.failedZpids}
                      runId: ${runId}
                      stepName: "property_data_retry"
                  result: propDataRetryKick
              - waitRetryPropData:
                  call: waitForBatch
                  args:
                    baseUrl: ${baseUrl}
                    collection: "property_data_batch_jobs"
                    jobId: ${propDataRetryKick.body.jobId}
                  result: propDataRetryResult

    - updatePropertyDataStep:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineUpdateRun"}
          auth:
            type: OIDC
          body:
            runId: ${runId}
            step: "property_data"
            data:
              status: "done"
              total: ${propDataResult.total}
              succeeded: ${propDataResult.done}
              failed: ${propDataResult.failed}
              skipped: ${propDataResult.skipped}
        result: _ignored2

    # --- STEP 2: Asset Secure ---
