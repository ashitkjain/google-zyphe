        args:
          baseUrl: ${baseUrl}
          collection: "asset_secure_batch_jobs"
          jobId: ${assetSecureKick.body.jobId}
        result: assetSecureResult

    - retryAssetSecure:
        switch:
          - condition: ${assetSecureResult.failed > 0}
            steps:
              - createRetryAssetSecure:
