        result: cgResult

    - retryContextGraph:
        switch:
          - condition: ${cgResult.failed > 0 AND len(cgResult.failedZpids) > 0}
            steps:
              - kickRetryCG:
                  call: http.post
                  args:
                    url: ${baseUrl + "/pipelineCreateBatchJob"}
                    auth:
                      type: OIDC
                    body:
                      collection: "context_graph_batch_jobs"
                      zpids: ${cgResult.failedZpids}
                      runId: ${runId}
                      stepName: "context_graph_retry"
                  result: cgRetryKick
              - waitRetryCG:
                  call: waitForBatch
                  args:
                    baseUrl: ${baseUrl}
                    collection: "context_graph_batch_jobs"
                    jobId: ${cgRetryKick.body.jobId}
                  result: _cgRetryResult

    - updateContextGraph:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineUpdateRun"}
          auth:
            type: OIDC
          body:
            runId: ${runId}
            step: "context_graph"
            data:
              status: "done"
              total: ${cgResult.total}
              succeeded: ${cgResult.done}
              failed: ${cgResult.failed}
              skipped: ${cgResult.skipped}
        result: _r5

    # --- STEP 6: Buyer DNA ---
    - kickBuyerDna:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineCreateBatchJob"}
          auth:
            type: OIDC
          body:
            collection: "buyer_dna_batch_jobs"
            zpids: ${zpids}
            runId: ${runId}
            stepName: "buyer_dna"
        result: dnaKick

    - waitBuyerDna:
        call: waitForBatch
        args:
          baseUrl: ${baseUrl}
          collection: "buyer_dna_batch_jobs"
          jobId: ${dnaKick.body.jobId}
        result: dnaResult

    - retryBuyerDna:
        switch:
          - condition: ${dnaResult.failed > 0 AND len(dnaResult.failedZpids) > 0}
            steps:
              - kickRetryDna:
                  call: http.post
                  args:
                    url: ${baseUrl + "/pipelineCreateBatchJob"}
                    auth:
                      type: OIDC
                    body:
                      collection: "buyer_dna_batch_jobs"
                      zpids: ${dnaResult.failedZpids}
                      runId: ${runId}
                      stepName: "buyer_dna_retry"
                  result: dnaRetryKick
              - waitRetryDna:
                  call: waitForBatch
