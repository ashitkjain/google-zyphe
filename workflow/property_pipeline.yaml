main:
  params: [args]
  steps:
    - init:
        assign:
          - runId: ${args.runId}
          - city: ${args.city}
          - state: ${args.state}
          - baseUrl: ${args.baseUrl}
          - zpids: ${args.zpids}

    - markRunning:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineUpdateRun"}
          auth:
            type: OIDC
          body:
            runId: ${runId}
            step: "_top"
            data:
              status: "running"
              startedAt: ${sys.now()}
        result: _r0

    # --- STEP 1: Property Data ---
    - kickPropertyData:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineCreateBatchJob"}
          auth:
            type: OIDC
          body:
            collection: "property_data_batch_jobs"
            zpids: ${zpids}
            runId: ${runId}
            stepName: "property_data"
        result: propDataKick

    - waitPropertyData:
        call: waitForBatch
        args:
          baseUrl: ${baseUrl}
          collection: "property_data_batch_jobs"
          jobId: ${propDataKick.body.jobId}
        result: propDataResult

    - retryPropertyData:
        switch:
          - condition: ${propDataResult.failed > 0 AND len(propDataResult.failedZpids) > 0}
            steps:
              - kickRetryPropData:
                  call: http.post
                  args:
                    url: ${baseUrl + "/pipelineCreateBatchJob"}
                    auth:
                      type: OIDC
                    body:
                      collection: "property_data_batch_jobs"
                      zpids: ${propDataResult.failedZpids}
                      runId: ${runId}
                      stepName: "property_data_retry"
                  result: propDataRetryKick
              - waitRetryPropData:
                  call: waitForBatch
                  args:
                    baseUrl: ${baseUrl}
                    collection: "property_data_batch_jobs"
                    jobId: ${propDataRetryKick.body.jobId}
                  result: _propDataRetryResult

    - updatePropertyData:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineUpdateRun"}
          auth:
            type: OIDC
          body:
            runId: ${runId}
            step: "property_data"
            data:
              status: "done"
              total: ${propDataResult.total}
              succeeded: ${propDataResult.done}
              failed: ${propDataResult.failed}
              skipped: ${propDataResult.skipped}
        result: _r1

    # --- STEP 2: Asset Secure ---
    - kickAssetSecure:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineCreateBatchJob"}
          auth:
            type: OIDC
          body:
            collection: "asset_secure_batch_jobs"
            zpids: ${zpids}
            runId: ${runId}
            stepName: "asset_secure"
        result: assetKick

    - waitAssetSecure:
        call: waitForBatch
        args:
          baseUrl: ${baseUrl}
          collection: "asset_secure_batch_jobs"
          jobId: ${assetKick.body.jobId}
        result: assetResult

    - retryAssetSecure:
        switch:
          - condition: ${assetResult.failed > 0 AND len(assetResult.failedZpids) > 0}
            steps:
              - kickRetryAsset:
                  call: http.post
                  args:
                    url: ${baseUrl + "/pipelineCreateBatchJob"}
                    auth:
                      type: OIDC
                    body:
                      collection: "asset_secure_batch_jobs"
                      zpids: ${assetResult.failedZpids}
                      runId: ${runId}
                      stepName: "asset_secure_retry"
                  result: assetRetryKick
              - waitRetryAsset:
                  call: waitForBatch
                  args:
                    baseUrl: ${baseUrl}
                    collection: "asset_secure_batch_jobs"
                    jobId: ${assetRetryKick.body.jobId}
                  result: _assetRetryResult

    - updateAssetSecure:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineUpdateRun"}
          auth:
            type: OIDC
          body:
            runId: ${runId}
            step: "asset_secure"
            data:
              status: "done"
              total: ${assetResult.total}
              succeeded: ${assetResult.done}
              failed: ${assetResult.failed}
              skipped: ${assetResult.skipped}
        result: _r2

    # --- STEP 3: Full Intel ---
    - kickIntel:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineCreateBatchJob"}
          auth:
            type: OIDC
          body:
            collection: "full_intel_batch_jobs"
            zpids: ${zpids}
            runId: ${runId}
            stepName: "intel"
        result: intelKick

    - waitIntel:
        call: waitForBatch
        args:
          baseUrl: ${baseUrl}
          collection: "full_intel_batch_jobs"
          jobId: ${intelKick.body.jobId}
        result: intelResult

    - retryIntel:
        switch:
          - condition: ${intelResult.failed > 0 AND len(intelResult.failedZpids) > 0}
            steps:
              - kickRetryIntel:
                  call: http.post
                  args:
                    url: ${baseUrl + "/pipelineCreateBatchJob"}
                    auth:
                      type: OIDC
                    body:
                      collection: "full_intel_batch_jobs"
                      zpids: ${intelResult.failedZpids}
                      runId: ${runId}
                      stepName: "intel_retry"
                  result: intelRetryKick
              - waitRetryIntel:
                  call: waitForBatch
                  args:
                    baseUrl: ${baseUrl}
                    collection: "full_intel_batch_jobs"
                    jobId: ${intelRetryKick.body.jobId}
                  result: _intelRetryResult

    - updateIntel:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineUpdateRun"}
          auth:
            type: OIDC
          body:
            runId: ${runId}
            step: "intel"
            data:
              status: "done"
              total: ${intelResult.total}
              succeeded: ${intelResult.done}
              failed: ${intelResult.failed}
              skipped: ${intelResult.skipped}
        result: _r3

    # --- STEP 4: Orientation ---
    - kickOrientation:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineCreateBatchJob"}
          auth:
            type: OIDC
          body:
            collection: "orientation_batch_jobs"
            zpids: ${zpids}
            runId: ${runId}
            stepName: "orientation"
        result: orientKick

    - waitOrientation:
        call: waitForBatch
        args:
          baseUrl: ${baseUrl}
          collection: "orientation_batch_jobs"
          jobId: ${orientKick.body.jobId}
        result: orientResult

    - retryOrientation:
        switch:
          - condition: ${orientResult.failed > 0 AND len(orientResult.failedZpids) > 0}
            steps:
              - kickRetryOrient:
                  call: http.post
                  args:
                    url: ${baseUrl + "/pipelineCreateBatchJob"}
                    auth:
                      type: OIDC
                    body:
                      collection: "orientation_batch_jobs"
                      zpids: ${orientResult.failedZpids}
                      runId: ${runId}
                      stepName: "orientation_retry"
                  result: orientRetryKick
              - waitRetryOrient:
                  call: waitForBatch
                  args:
                    baseUrl: ${baseUrl}
                    collection: "orientation_batch_jobs"
                    jobId: ${orientRetryKick.body.jobId}
                  result: _orientRetryResult

    - updateOrientation:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineUpdateRun"}
          auth:
            type: OIDC
          body:
            runId: ${runId}
            step: "orientation"
            data:
              status: "done"
              total: ${orientResult.total}
              succeeded: ${orientResult.done}
              failed: ${orientResult.failed}
              skipped: ${orientResult.skipped}
        result: _r4

    # --- STEP 5: Context Graph ---
    - kickContextGraph:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineCreateBatchJob"}
          auth:
            type: OIDC
          body:
