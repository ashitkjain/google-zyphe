    # --- STEP 7: Smoke Check ---
    - smokeCheck:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineSmokeCheck"}
          auth:
            type: OIDC
          body:
            zpids: ${zpids}
            runId: ${runId}
        result: smokeResult

    - updateSmoke:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineUpdateRun"}
          auth:
            type: OIDC
          body:
            runId: ${runId}
            step: "smoke"
            data:
              status: "done"
              total: ${smokeResult.body.total}
              passed: ${smokeResult.body.passed}
              failed: ${smokeResult.body.failed}
        result: _ignored_smoke

    # --- Finalize ---
    - finalize:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineUpdateRun"}
          auth:
            type: OIDC
          body:
            runId: ${runId}
            step: "_top"
            data:
              status: "completed"
              completedAt: ${sys.now()}
        result: _finalResult

    - done:
        return: ${runId}

waitForBatch:
  params: [args]
  steps:
    - initPoll:
        assign:
          - collection: ${args.collection}
          - jobId: ${args.jobId}
          - baseUrl: ${args.baseUrl}
          - maxWaitSeconds: 3600
          - elapsed: 0

    - poll:
        call: http.post
        args:
          url: ${args.baseUrl + "/pipelinePollBatch"}
          auth:
            type: OIDC
          body:
            collection: ${collection}
            jobId: ${jobId}
        result: pollResult

    - checkDone:
        switch:
          - condition: ${pollResult.body.status == "completed"}
            next: extractFailedZpids
          - condition: ${elapsed >= maxWaitSeconds}
            next: timeout

    - sleep:
        call: sys.sleep
        args:
          seconds: 30

    - tick:
        assign:
          - elapsed: ${elapsed + 30}
        next: poll

    - timeout:
        return:
          status: "timeout"
          done: 0
          failed: 0
          total: 0
          skipped: 0
          failedZpids: []

    - extractFailedZpids:
        assign:
          - results: ${pollResult.body.results}
          - failedZpids: []

    - returnResult:
        return:
          status: ${pollResult.body.status}
          done: ${pollResult.body.done}
          failed: ${pollResult.body.failed}
          total: ${pollResult.body.total}
          skipped: ${default(map.get(pollResult.body, "skipped"), 0)}
          failedZpids: ${failedZpids}
