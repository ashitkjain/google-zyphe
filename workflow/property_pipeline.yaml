              total: ${assetSecureResult.total}
              succeeded: ${assetSecureResult.done}
              failed: ${assetSecureResult.failed}
              skipped: ${assetSecureResult.skipped}
        result: _ignored3

    # --- STEP 3: Intel ---
    - kickIntel:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineCreateBatchJob"}
          auth:
            type: OIDC
          body:
            collection: "full_intel_batch_jobs"
            zpids: ${zpids}
            runId: ${runId}
