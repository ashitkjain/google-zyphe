            runId: ${runId}
            step: "context_graph"
            data:
              status: "done"
              total: ${contextGraphResult.total}
              succeeded: ${contextGraphResult.done}
              failed: ${contextGraphResult.failed}
              skipped: ${contextGraphResult.skipped}
        result: _ignored6

    # --- STEP 6: Buyer DNA ---
    - kickBuyerDna:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineCreateBatchJob"}
          auth:
            type: OIDC
          body:
            collection: "buyer_dna_batch_jobs"
            zpids: ${zpids}
            runId: ${runId}
            stepName: "buyer_dna"
        result: buyerDnaKick

    - waitBuyerDna:
        call: waitForBatch
        args:
          baseUrl: ${baseUrl}
          collection: "buyer_dna_batch_jobs"
          jobId: ${buyerDnaKick.body.jobId}
        result: buyerDnaResult

    - retryBuyerDna:
        switch:
          - condition: ${buyerDnaResult.failed > 0}
            steps:
              - createRetryBuyerDna:
                  call: http.post
                  args:
                    url: ${baseUrl + "/pipelineCreateBatchJob"}
                    auth:
                      type: OIDC
                    body:
                      collection: "buyer_dna_batch_jobs"
                      zpids: ${buyerDnaResult.failedZpids}
