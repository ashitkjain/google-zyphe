    # --- STEP 7: Smoke Check ---
    - smokeCheck:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineSmokeCheck"}
          auth:
            type: OIDC
          body:
            zpids: ${zpids}
            runId: ${runId}
        result: smokeResult

    - updateSmoke:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineUpdateRun"}
          auth:
            type: OIDC
          body:
            runId: ${runId}
            step: "smoke"
            data:
              status: "done"
              total: ${smokeResult.body.total}
              passed: ${smokeResult.body.passed}
              failed: ${smokeResult.body.failed}
        result: _r7

    # --- Finalize ---
    - finalize:
        call: http.post
        args:
          url: ${baseUrl + "/pipelineUpdateRun"}
          auth:
            type: OIDC
          body:
            runId: ${runId}
            step: "_top"
            data:
              status: "completed"
              completedAt: ${sys.now()}
        result: _rFinal

    - done:
        return: ${runId}


waitForBatch:
  params: [baseUrl, collection, jobId]
  steps:
    - initPoll:
        assign:
          - maxWaitSeconds: 3600
          - elapsed: 0

    - poll:
        call: http.post
        args:
          url: ${baseUrl + "/pipelinePollBatch"}
          auth:
            type: OIDC
          body:
            collection: ${collection}
            jobId: ${jobId}
        result: pollResult

    - checkDone:
        switch:
          - condition: ${pollResult.body.status == "completed"}
            next: returnResult
          - condition: ${elapsed >= maxWaitSeconds}
            next: timeout

    - sleep:
        call: sys.sleep
        args:
          seconds: 30

    - tick:
        assign:
          - elapsed: ${elapsed + 30}
        next: poll

    - timeout:
        return:
          status: "timeout"
          done: 0
          failed: 0
          total: 0
          skipped: 0
          failedZpids: []

    - returnResult:
        return:
          status: ${pollResult.body.status}
          done: ${default(map.get(pollResult.body, "done"), 0)}
          failed: ${default(map.get(pollResult.body, "failed"), 0)}
          total: ${default(map.get(pollResult.body, "total"), 0)}
          skipped: ${default(map.get(pollResult.body, "skipped"), 0)}
          failedZpids: ${default(map.get(pollResult.body, "failedZpids"), [])}
