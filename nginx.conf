server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Gemini API Proxy (Catch-all for both /api_proxy and /api_proxy/)
    location /api_proxy {
        # This handles the case where the SDK hits /api_proxy without a trailing slash
        rewrite ^/api_proxy/(.*) /$1 break;
        rewrite ^/api_proxy(.*) /$1 break;
        
        proxy_pass https://generativelanguage.googleapis.com;
        proxy_set_header Host generativelanguage.googleapis.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Ensure POST is allowed specifically
        proxy_method $request_method;
        proxy_pass_request_headers on;
    }

    # Firebase Storage Proxy
    location /storage-proxy/ {
        proxy_pass https://firebasestorage.googleapis.com/;
        proxy_set_header Host firebasestorage.googleapis.com;
        proxy_ssl_server_name on;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
