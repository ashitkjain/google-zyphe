  <style>
    body {
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background-color: #f8fafc;
    }

    /* Post-it Delete Animation */
    @keyframes flyAway {
      0% {
        transform: scale(1) rotate(var(--rotation, 0deg));
        opacity: 1;
      }

      20% {
        transform: scale(1.1) rotate(-10deg);
      }

      100% {
        top: calc(100vh - 6rem);
        left: 50%;
        transform: translate(-50%, 0) scale(0.1) rotate(360deg);
        opacity: 0;
      }
    }

    /* Fly Up Animation (for Done/Checkmark) */
    @keyframes flyUp {
      0% {
        transform: translateY(0) scale(1) rotate(var(--rotation, 0deg));
        opacity: 1;
      }

      100% {
        transform: translateY(-500px) scale(0) rotate(720deg);
        opacity: 0;
      }
    }

    .animate-fly-away {
      position: fixed !important;
      top: var(--start-top);
      left: var(--start-left);
      z-index: 9999 !important;
      width: 6rem !important;
      /* w-24 is 6rem */
      height: 6rem !important;
      /* h-24 is 6rem */
      pointer-events: none;
      animation: flyAway 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
      margin: 0 !important;
    }

    .animate-fly-up {
      pointer-events: none;
      animation: flyUp 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
      z-index: 9999 !important;
    }

    .bin-active {
      animation: pulse-red 1s infinite;
    }

    @keyframes pulse-red {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7);
        transform: scale(1);
      }

      50% {
        box-shadow: 0 0 0 10px rgba(244, 63, 94, 0);
        transform: scale(1.1);
      }
    }

    @keyframes flameFlicker {
      0% {
        transform: scale(1) rotate(-2deg) skewX(1deg);
        opacity: 0.9;
      }

      25% {
        transform: scale(1.1) rotate(2deg) skewX(-1deg);
        opacity: 1;
      }

      50% {
        transform: scale(1.05) rotate(-1deg) skewX(2deg);
        opacity: 0.95;
      }

      75% {
        transform: scale(1.15) rotate(3deg) skewX(-2deg);
        opacity: 1;
      }

      100% {
        transform: scale(1) rotate(-2deg) skewX(1deg);
        opacity: 0.9;
      }
    }

    .animate-flame {
      animation: flameFlicker 0.6s ease-in-out infinite;
      transform-origin: bottom center;
    }

    /* 3-Dot Loading Animation */
    .loader-dots span {
      animation: loaderDots 0.6s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    }

    .loader-dots span:nth-child(1) {
      animation-delay: -0.4s;
    }

    .loader-dots span:nth-child(2) {
      animation-delay: -0.2s;
    }

    .loader-dots span:nth-child(3) {
      animation-delay: 0s;
    }

    @keyframes loaderDots {
      from {
        transform: translateY(0);
        opacity: 0.5;
        transform: scale(0.9);
      }

      to {
        transform: translateY(-6px);
        opacity: 1;
        transform: scale(1.1);
      }
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
